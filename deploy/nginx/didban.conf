# Didban behind Nginx: the same layout as deploy/caddy/Caddyfile (a sample; Caddy is the default).
# Replace analytics.example.com and the certificate paths (certbot or your own ACME client).
# Open-source Nginx only has passive health checks: a refused or failed connection marks an
# instance down for `fail_timeout` and the request is retried on the other one.
upstream didban_api {
    server 127.0.0.1:5101 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:5102 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name analytics.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name analytics.example.com;

    ssl_certificate     /etc/letsencrypt/live/analytics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # No access log: it would persist raw client IPs (spec §12).
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    client_max_body_size 1m;

    # Only /api/ reaches the API: GET /metrics (outside /api) is scraped on 127.0.0.1:510x
    # directly with a bearer token and is never proxied (spec §15, ADR 0049).
    location /api/ {
        proxy_pass http://didban_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Nginx is the only hop: the API trusts one (TRUST_PROXY=1) and reads the client IP here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    root /srv/didban/www;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # add_header in a location replaces the server's: repeat the shared ones.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
